<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: file:; media-src 'self' file:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com" />
  <title>snipit-good library</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header id="titlebar">
    <span class="brand">snipit<span class="dot">-</span>good</span>
    <span class="title-sub">library</span>
    <span class="spacer"></span>
    <span id="title-meta"></span>
  </header>

  <div id="main">
  <aside id="sidebar">
    <div id="side-head">
      <span>History</span>
      <span id="side-count"></span>
    </div>
    <div id="side-list"></div>
  </aside>

  <div id="content">
  <div id="empty-pane" hidden>Nothing here yet — press the capture shortcut to take a snip.</div>

  <div id="video-pane" hidden>
    <div id="video-stage"><video id="vplayer" controls></video></div>
    <footer id="video-bar">
      <span id="video-meta" class="dims"></span>
      <span class="flex-spacer"></span>
      <button class="btn-primary" id="btn-vshare" title="Upload the recording and copy a share link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Share link
      </button>
      <button class="btn-ghost" id="btn-vcopy" title="Copy the video file — paste it into chats or folders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy file
      </button>
      <button class="btn-ghost" id="btn-vsave">Save as…</button>
      <button class="btn-ghost" id="btn-vfolder">Show in folder</button>
    </footer>
  </div>

  <div id="toolbar">
    <div class="tool-group" id="tools">
      <button class="tool active" data-tool="pen" title="Pen (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Pen</span>
      </button>
      <button class="tool" data-tool="highlight" title="Highlighter (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 6 6"/><path d="M4 20h5l10.5-10.5a2.1 2.1 0 0 0-3-3L6 17Z"/><path d="M4 20H2"/></svg>
        <span>Highlight</span>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
        <span>Rectangle</span>
      </button>
      <button class="tool" data-tool="ellipse" title="Circle (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/></svg>
        <span>Circle</span>
      </button>
      <button class="tool" data-tool="line" title="Line (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 19 5"/></svg>
        <span>Line</span>
      </button>
      <button class="tool" data-tool="arrow" title="Arrow (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M10 5h9v9"/></svg>
        <span>Arrow</span>
      </button>
      <button class="tool" data-tool="text" title="Text (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
        <span>Text</span>
      </button>
      <button class="tool" data-tool="pixelate" title="Pixelate (X)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h5v5H4zM9 9h5v5H9zM14 4h5v5h-5zM14 14h5v5h-5zM4 14h5v5H4z"/></svg>
        <span>Pixelate</span>
      </button>
    </div>

    <span class="vsep"></span>

    <div class="tool-group">
      <button id="color-btn" title="Ink colour">
        <span id="color-swatch"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button id="width-btn" title="Stroke width">
        <span id="width-dot"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <span class="vsep"></span>

    <div class="tool-group">
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </div>

    <span class="flex-spacer"></span>

    <div class="tool-group">
      <button class="icon-btn" id="btn-zoom-out" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoom-label" title="Zoom to 100%">100%</button>
      <button class="icon-btn" id="btn-zoom-in" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btn-zoom-fit" title="Fit to window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>

    <button class="btn-ghost" id="btn-variant" title="Save the annotated result as a new library item — the original stays untouched">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      Save to library
    </button>
    <button class="btn-ghost" id="btn-share" title="Upload this image (with annotations) and copy a share link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Share link
    </button>
    <button class="btn-primary" id="btn-copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy to clipboard
    </button>
  </div>

  <main id="viewport">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="text-layer"></div>
    </div>
  </main>

  <footer id="statusbar">
    <span id="dims" class="dims">— × —</span>
    <span class="vsep"></span>
    <button class="btn-ghost tool-foot" id="btn-crop" title="Crop the image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
      Crop
    </button>
    <button class="btn-ghost" id="btn-reset" title="Reset crop to the original size">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Reset
    </button>
    <span class="flex-spacer"></span>
    <button class="btn-ghost" id="btn-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save image
    </button>
  </footer>
  </div><!-- /#content -->
  </div><!-- /#main -->

  <div id="color-pop" class="popover" hidden>
    <div class="swatches"></div>
    <label class="custom-color">Custom <input type="color" id="color-input" /></label>
  </div>
  <div id="width-pop" class="popover" hidden></div>

  <div id="share-modal" class="share-modal" hidden>
    <div class="share-card">
      <h2>Create share link</h2>
      <div class="share-fields">
        <label>Link expires
          <select id="share-expiry">
            <option value="1">After 1 day</option>
            <option value="7">After 7 days</option>
            <option value="30" selected>After 30 days</option>
            <option value="">Never</option>
          </select>
        </label>
        <label>Password <span class="opt">(optional)</span>
          <input type="text" id="share-password" placeholder="No password" autocomplete="off" spellcheck="false">
        </label>
        <label>Burn after views <span class="opt">(optional)</span>
          <input type="number" id="share-maxviews" min="1" max="1000" placeholder="Unlimited">
        </label>
      </div>
      <div id="share-progress" class="share-progress" hidden><div id="share-progress-fill"></div></div>
      <div id="share-result" class="share-result" hidden>
        <input type="text" id="share-url" readonly>
        <span class="share-copied">Link copied to clipboard ✓</span>
      </div>
      <div id="share-error" class="share-error" hidden></div>
      <div class="share-actions">
        <button class="btn-ghost" id="share-cancel">Close</button>
        <button class="btn-primary" id="share-go">Create link</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><span class="tick">✓</span><span id="toast-text"></span></div>

  <script src="editor.js"></script>
</body>
</html>
