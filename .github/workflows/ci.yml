name: CI

# Build check on every push/PR to main so a broken build never reaches a tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # version-bump commits are built by the tag-triggered Release workflow;
    # don't build them twice. ([skip ci] can't be used for this — GitHub
    # applies it to the tag push as well, which would skip the release.)
    if: ${{ !contains(github.event.head_commit.message, '[version bump]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer (not published)
        run: npx electron-builder --win --publish never
