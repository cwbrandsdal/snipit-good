name: Release

# Publishing flow:
#   npm version patch   (bumps package.json + creates the vX.Y.Z tag)
#   git push --follow-tags
# The tag triggers this workflow, which builds the Windows installer and
# publishes it (plus latest.yml for the auto-updater) to a GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload assets

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder uploads to a DRAFT release (its default, and the
      # reliable path — publishing directly races the parallel asset uploads
      # and can drop files). The draft goes live only after every asset is up.
      - name: Build installer and upload to draft release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
